<svg viewBox="0 0 720 406" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Colorado FY 2024 SNAP QC comparison: cases not exact by computation stage, first run versus current">
  <style>
    .t  { font: 600 19px var(--f-body, -apple-system, "Segoe UI", sans-serif); fill: var(--color-ink, #1c1917); }
    .st { font: 400 13.5px var(--f-body, -apple-system, "Segoe UI", sans-serif); fill: var(--color-ink-secondary, #57534e); }
    .lb { font: 400 14px var(--f-body, -apple-system, "Segoe UI", sans-serif); fill: var(--color-ink, #1c1917); }
    .n  { font: 500 14px var(--f-mono, "SF Mono", "Fira Code", monospace); fill: var(--color-ink, #1c1917); }
    .nz { font: 400 14px var(--f-mono, "SF Mono", "Fira Code", monospace); fill: var(--color-ink-muted, #78716c); }
    .hd { font: 500 12px var(--f-body, -apple-system, "Segoe UI", sans-serif); fill: var(--color-ink-muted, #78716c); letter-spacing: 0.04em; }
    .ft { font: 400 13.5px var(--f-body, -apple-system, "Segoe UI", sans-serif); fill: var(--color-ink-secondary, #57534e); }
    .fg { font: 600 13.5px var(--f-body, -apple-system, "Segoe UI", sans-serif); fill: var(--color-success, #166534); }
    .bar  { fill: var(--color-accent, #92400e); }
    .zero { fill: var(--color-rule-strong, #78716c); }
    .axis { stroke: var(--color-rule, #e7e5e4); stroke-width: 1; }
  </style>

  <text x="24" y="38" class="t">Where the encoding diverged, and where it stands</text>
  <text x="24" y="60" class="st">856 Colorado FY 2024 SNAP QC cases, replayed stage by stage</text>

  <!-- column header -->
  <text x="200" y="94" class="hd">CASES DIVERGING, FIRST RUN (OF 856)</text>

  <!-- axis line -->
  <line x1="196" y1="102" x2="196" y2="312" class="axis"/>

  <!-- rows: label x=184 right-aligned; bar x=200, scale 40 -> 400px (10px/case); zero = 3px stub -->
  <!-- gross income: 0 -->
  <text x="184" y="122" text-anchor="end" class="lb">gross income</text>
  <rect x="196" y="112" width="3" height="14" rx="1.5" class="zero"/>
  <text x="210" y="123" class="nz">0</text>

  <!-- standard deduction: 0 -->
  <text x="184" y="158" text-anchor="end" class="lb">standard deduction</text>
  <rect x="196" y="148" width="3" height="14" rx="1.5" class="zero"/>
  <text x="210" y="159" class="nz">0</text>

  <!-- shelter deduction: 1 -->
  <text x="184" y="194" text-anchor="end" class="lb">shelter deduction</text>
  <rect x="196" y="184" width="10" height="14" rx="1.5" class="bar"/>
  <text x="216" y="195" class="n">1</text>

  <!-- net income: 15 -->
  <text x="184" y="230" text-anchor="end" class="lb">net income</text>
  <rect x="196" y="220" width="150" height="14" rx="1.5" class="bar"/>
  <text x="356" y="231" class="n">15</text>

  <!-- maximum allotment: 0 -->
  <text x="184" y="266" text-anchor="end" class="lb">maximum allotment</text>
  <rect x="196" y="256" width="3" height="14" rx="1.5" class="zero"/>
  <text x="210" y="267" class="nz">0</text>

  <!-- benefit: 40 -->
  <text x="184" y="302" text-anchor="end" class="lb">benefit</text>
  <rect x="196" y="292" width="400" height="14" rx="1.5" class="bar"/>
  <text x="606" y="303" class="n">40</text>

  <!-- footer -->
  <text x="24" y="330" class="hd">Intermediates counted beyond the file's $1 whole-dollar precision; benefit compared exactly.</text>
  <line x1="24" y1="344" x2="696" y2="344" class="axis"/>
  <text x="24" y="370" class="ft">After three fixes — homeless-deduction cap, whole-dollar rounding, unit-level disability status:</text>
  <text x="24" y="390" class="fg">0 at every stage. 856/856 exact — all 5,136 comparisons, zero tolerance.</text>
</svg>
